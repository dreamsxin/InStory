services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      PORT: '4000'
      HOST: 0.0.0.0
      SQLITE_DATABASE_PATH: /app/data/instory.sqlite
      # Required in production. Generate with:
      #   node -e "console.log(require('node:crypto').randomBytes(32).toString('hex'))"
      ADMIN_TOKEN: ${ADMIN_TOKEN:?ADMIN_TOKEN is required}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-45000}
    ports:
      - '4000:4000'
    volumes:
      - server-data:/app/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:4000}
    environment:
      # Server-side only: used by server components and server actions.
      ADMIN_TOKEN: ${ADMIN_TOKEN:?ADMIN_TOKEN is required}
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:4000}
    ports:
      - '3000:3000'
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  server-data:
