services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      PORT: '4000'
      HOST: 0.0.0.0
      SQLITE_DATABASE_PATH: /app/data/instory.sqlite
      # Required in production. Generate with:
      #   node -e "console.log(require('node:crypto').randomBytes(32).toString('hex'))"
      ADMIN_TOKEN: ${ADMIN_TOKEN:?ADMIN_TOKEN is required}
      # Accounts that hold the admin role, comma separated. /admin is gated on the
      # role, so without this the console has no reachable door on a fresh deploy.
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-45000}
      # The web container proxies /api, so the API sees the proxy's address unless it
      # is told to read X-Forwarded-For. Trust the compose network's range rather than
      # a hop count: fastify 5.12 dropped hop-count trust (GHSA-3m5p-2c4r-xxw2 was
      # about spoofing under exactly that), and an address range is what this really
      # means. Adjust if your compose network uses a different subnet.
      TRUST_PROXY: '172.16.0.0/12'

    ports:
      - '4000:4000'
    volumes:
      - server-data:/app/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      # Server-side only: used by server components and server actions.
      ADMIN_TOKEN: ${ADMIN_TOKEN:?ADMIN_TOKEN is required}
      # Server components and server actions call the API directly, so this has to be
      # the address the API answers on inside the network, not the browser's view of it.
      NEXT_PUBLIC_API_BASE: http://server:4000
      # Where the /api rewrite forwards browser traffic. Same reason.
      API_PROXY_TARGET: http://server:4000
    ports:
      - '3000:3000'
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  server-data:
