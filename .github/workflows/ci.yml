name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # node:sqlite is only available on Node 22+, and the workspace targets Node 24.
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Only Chrome: the suite checks behaviour, not cross-browser rendering. The
      # config targets the chrome channel so a local run can reuse an already
      # installed Chrome instead of downloading a browser.
      - name: Install browser
        run: npx playwright install --with-deps chrome

      - name: End-to-end tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # This step gates the build. It used to be advisory-only *and* filtered to
      # high, which together meant nothing could ever fail it - which is how a
      # critical in the tree went unnoticed. The level is 'critical' rather than
      # 'high' only because three high findings are still open and tracked in
      # docs/PROGRESS.md 已知问题; tighten it to high once they are bumped.
      - name: Audit dependencies (critical fails the build)
        run: npm audit --audit-level=critical
      # Everything else, printed but not blocking, so the open findings stay
      # visible instead of being filtered out of the log.
      - name: Full advisory report
        if: always()
        run: npm audit
        continue-on-error: true

  # Every open finding has a fixed version inside its parent's range, so a plain
  # re-resolve should clear them - but npm's resolver crashes on this workspace on the
  # maintainer's machine ('Cannot read properties of null (reading edgesOut)'), for any
  # range change, with or without --package-lock-only, on either registry. So the
  # refresh happens here instead: this job resolves a new lockfile, audits it, and
  # uploads it. Downloading that artifact and committing it is then the whole upgrade.
  # Advisory only - it must never block a PR on a version published this morning.
  lockfile-refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Re-resolve the lockfile within the declared ranges
        run: npm install --package-lock-only

      - name: Show what moved
        run: git --no-pager diff --stat package-lock.json

      - name: Audit the refreshed lockfile
        run: npm audit
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        with:
          name: refreshed-package-lock
          path: package-lock.json
          retention-days: 7



